name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check src tests
      - name: Mypy typecheck
        run: mypy src
      - name: Pytest unit & API contract tests
        run: pytest tests -m "not integration" --cov=src --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prettier format check
        run: npm run format:check
      - name: Oxlint (0 warnings enforced)
        run: npm run lint
      - name: TypeScript strict typecheck
        run: npm run typecheck
      - name: Vitest unit tests
        run: npm run test
      - name: Production Vite build
        run: npm run build
